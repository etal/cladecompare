[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CladeCompare"
dynamic = ["version"]
description = "Compare protein sequence alignments to identify contrasting sites."
readme = "README.rst"
requires-python = ">=3.12"
# The bundled DejaVu font is under the Bitstream Vera license; the DejaVu
# changes to it are in the public domain.
license = "BSD-2-Clause AND Bitstream-Vera"
license-files = ["LICENSE", "cladecomparelib/data/LICENSE.DejaVu"]
authors = [
    {name = "Eric Talevich", email = "me+code@etal.mozmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The biopython, bottle, reportlab and scipy floors follow the versions Ubuntu
# 26.04 ships. bottle is not an extra, because the cladeweb command is always
# installed. WebLogo comes in through the logo extra of biofrills. The
# biofrills floor is a development version, because biofrills 0.4.0 is not yet
# released and PEP 440 orders 0.4.0.dev0 below 0.4; a development floor also
# admits later pre-releases, so raise it to 0.4.0 once that release exists.
dependencies = [
    "biofrills[logo]>=0.4.0.dev0",
    "biopython>=1.86",
    "bottle>=0.13.2",
    "reportlab>=4.4.10",
    "scipy>=1.16.3",
]

[project.scripts]
cladecompare = "cladecomparelib.cladecompare:main"
cladereport = "cladecomparelib.cladereport:main"
cladeweb = "cladecomparelib.cladeweb:main"

[project.urls]
homepage = "https://github.com/etal/cladecompare"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.17.2",
]

# Named explicitly: automatic discovery would also declare cladecomparelib.data
# a package.
[tool.setuptools]
packages = ["cladecomparelib"]

[tool.setuptools.package-data]
cladecomparelib = ["data/DejaVuSansMono-Bold.ttf", "data/LICENSE.DejaVu"]

[tool.setuptools.dynamic]
version = {attr = "cladecomparelib.__version__"}

[tool.pytest.ini_options]
minversion = "9.0.2"
testpaths = ["tests"]
markers = [
    "integration: runs the external programs that CladeCompare drives",
]

[tool.ruff]
# tests/data/capture_py27.py is the Python 2.7 script that captured the
# reference outputs, and runs in the py27-oracle environment; the pyupgrade
# rules would rewrite it into code that Python 2 cannot run. .pixi holds the
# pixi environments, including a Python 2.7 standard library, and is otherwise
# excluded only through .gitignore.
extend-exclude = [".pixi", "tests/data/capture_py27.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "LOG", "G"]
# The code base uses percent formatting in most places and is not otherwise
# modernized. The dict-keyed templates of pmlscript do not convert to
# f-strings, so the UP031 fix would leave a mix of str.format and f-strings,
# in strings whose output tests/data/py27 records.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# Two PyMOL templates end lines in a space that the recorded 1HCK.pdb.pml
# contains. ruff format leaves whitespace inside strings alone, so W291 is the
# only rule that reports it.
"cladecomparelib/pmlscript.py" = ["W291"]

# biofrills comes from its repository at a pinned commit, which the lock files
# then record; moving to a newer commit is a deliberate change of the pin,
# to be judged against the reference outputs in tests/data, and the pip
# command in README.rst names the same commit. pixi reads this table too, so
# it serves both workflows, and both need a git executable to install. Delete
# it when biofrills 0.4.0 is on PyPI.
[tool.uv.sources]
biofrills = {git = "https://github.com/etal/biofrills.git", rev = "4aa8b57a5192b79707dc11ed8cdaf14b548fc257"}

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

# Version constraints live in [project] and [dependency-groups]. The Python
# packages are named here only so that conda-forge supplies them rather than
# PyPI; WebLogo has no conda entry, because no conda build reaches the floor
# that biofrills sets, so it comes from PyPI. The programs are the reason for
# this workspace: HMMER for --hmm and --pdb, and MUSCLE 3 for inputs of unequal
# width, since MUSCLE 5 has no profile-profile mode.
[tool.pixi.dependencies]
biopython = "*"
bottle = "*"
reportlab = "*"
scipy = "*"
hmmer = "*"
muscle = "3.8.*"

[tool.pixi.pypi-dependencies]
cladecompare = {path = ".", editable = true}

[tool.pixi.feature.dev]
# Keeps osx-64, which only py27-oracle needs, out of the Python 3 environments.
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest"
test-integration = {cmd = "pytest -m integration", env = {CLADECOMPARE_REQUIRE_TOOLS = "1"}}
lint = "ruff check"
fmt = "ruff format"

# The oldest supported Python; keep in step with requires-python.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

# The environment that captured tests/data/py27; tests/data/README.md records
# its versions and how it differs from the original capture environment.
[tool.pixi.feature.py27-oracle]
platforms = ["osx-64"]

[tool.pixi.feature.py27-oracle.dependencies]
python = "2.7.15.*"
biopython = "1.76.*"
numpy = "1.16.5.*"
scipy = "1.2.1.*"
reportlab = "3.5.42.*"
bottle = "0.12.18.*"
pillow = "6.2.1.*"
weblogo = "3.6.0.*"
hmmer = "3.0.*"
muscle = "3.8.1551.*"
setuptools = "*"

[tool.pixi.feature.py27-oracle.tasks]
capture = "python tests/data/capture_py27.py"

[tool.pixi.environments]
default = {features = ["dev"]}
py312 = {features = ["dev", "py312"]}
py27-oracle = {features = ["py27-oracle"], no-default-feature = true}
